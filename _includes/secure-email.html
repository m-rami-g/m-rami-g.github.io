<!-- Secure Email Display - Protected from spam bots -->
<script>
// Email obfuscation to prevent spam
function decodeEmail(encoded) {
    // Simple character shift obfuscation
    var decoded = "";
    for (var i = 0; i < encoded.length; i++) {
        decoded += String.fromCharCode(encoded.charCodeAt(i) - 1);
    }
    return decoded;
}

// Obfuscated email (each character shifted +1)
var encodedEmail = "nbsjhm/Sfni/Hfse/nbsjhm/Sfni/Hfse";
var emailParts = decodeEmail(encodedEmail).split('/');
var email = emailParts[0] + '@' + emailParts[1] + '.' + emailParts[2];

// Display email when page loads
document.addEventListener('DOMContentLoaded', function() {
    var emailElement = document.getElementById('secure-email');
    if (emailElement) {
        emailElement.innerHTML = '<a href="mailto:' + email + '">' + email + '</a>';
    }
});
</script>
