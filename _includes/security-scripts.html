<!-- Security and Privacy Scripts -->
<script>
// Email obfuscation and protection
document.addEventListener('DOMContentLoaded', function() {
  // Decode base64 encoded emails
  const emailElements = document.querySelectorAll('.email-obfuscated');
  emailElements.forEach(function(element) {
    const encodedEmail = element.getAttribute('data-email');
    if (encodedEmail) {
      try {
        const decodedEmail = atob(encodedEmail);
        const mailtoLink = document.createElement('a');
        mailtoLink.href = 'mailto:' + decodedEmail;
        mailtoLink.innerHTML = element.innerHTML;
        mailtoLink.className = 'email-link';
        
        // Add click tracking for security monitoring
        mailtoLink.addEventListener('click', function(e) {
          console.log('Email link clicked: ' + decodedEmail);
          // You could add analytics here if needed
        });
        
        element.parentNode.replaceChild(mailtoLink, element);
      } catch (e) {
        console.error('Error decoding email:', e);
      }
    }
  });
  
  // Anti-scraping measures
  const userAgent = navigator.userAgent.toLowerCase();
  const isBot = /bot|crawler|spider|crawling|scraper|curl|wget|python|java|php|ruby|perl|go|node/.test(userAgent);
  
  if (isBot) {
    // Log bot detection (for monitoring)
    console.log('Bot detected:', userAgent);
    
    // You could add additional anti-bot measures here
    // For example, redirect to a different page or show captcha
  }
  
  // Prevent right-click on sensitive elements
  const sensitiveElements = document.querySelectorAll('.author__urls-wrapper, .contact-info');
  sensitiveElements.forEach(function(element) {
    element.addEventListener('contextmenu', function(e) {
      e.preventDefault();
      return false;
    });
  });
});

// Content Security Policy violation reporting
if (typeof window !== 'undefined') {
  window.addEventListener('securitypolicyviolation', function(e) {
    console.warn('CSP Violation:', {
      blockedURI: e.blockedURI,
      violatedDirective: e.violatedDirective,
      originalPolicy: e.originalPolicy
    });
  });
}

// Privacy-focused analytics (optional)
function logPageView() {
  // Only log if user hasn't opted out
  if (!localStorage.getItem('analytics_opt_out')) {
    const data = {
      page: window.location.pathname,
      referrer: document.referrer || 'direct',
      timestamp: new Date().toISOString(),
      // Don't collect personal data
      userAgent: navigator.userAgent.substring(0, 50) // Truncated for privacy
    };
    
    // Send to your own analytics endpoint (if configured)
    // fetch('/api/analytics', { method: 'POST', body: JSON.stringify(data) });
    
    console.log('Page view:', data);
  }
}

// Initialize on page load
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', logPageView);
} else {
  logPageView();
}
</script>
