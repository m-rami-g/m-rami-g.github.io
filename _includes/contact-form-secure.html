<!-- Secure Contact Form with Anti-Spam Protection -->
<div class="contact-form-wrapper" id="contact-form">
  <h3>Contact Me</h3>
  <p class="contact-form-description">
    Please use this form to get in touch
  </p>
  
  <form id="secure-contact-form" class="contact-form" method="POST" action="https://formspree.io/f/mjvzzqgz" data-formspree-endpoint="https://formspree.io/f/mjvzzqgz">
    {% comment %}
      Note: Replace the Formspree endpoint with your own when deploying.
      Get a free endpoint at: https://formspree.io/
    {% endcomment %}
    
    <!-- CSRF Protection (hidden field) -->
    <input type="hidden" name="_csrf" value="{{ site.time | date: '%s' | sha256 }}">
    
    <!-- Formspree configuration -->
    <input type="hidden" name="_subject" value="Academic Website Contact - {{ site.author.name }}">
    <input type="hidden" name="_language" value="en">
    <input type="hidden" name="_format" value="plain">
    <input type="hidden" name="_next" value="{{ site.url }}/contact-thank-you">
    <input type="hidden" name="_replyto" id="_replyto">
    
    <!-- Honeypot field for spam protection -->
    <div class="honeypot-field" style="display: none;">
      <label for="website">Leave this field empty</label>
      <input type="url" id="website" name="website" tabindex="-1" autocomplete="off">
    </div>
    
    <!-- Timestamp for rate limiting -->
    <input type="hidden" name="_timestamp" value="{{ site.time | date: '%s' }}">
    
    <div class="form-group">
      <label for="name">Your Name *</label>
      <input type="text" id="name" name="name" required 
             minlength="2" maxlength="100"
             pattern="[A-Za-z\s\-\.]{2,100}"
             title="Please enter a valid name (2-100 characters, letters, spaces, hyphens, and periods only)">
    </div>
    
    <div class="form-group">
      <label for="email">Your Email *</label>
      <input type="email" id="email" name="email" required
             pattern="[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$"
             title="Please enter a valid email address">
    </div>
    
    <div class="form-group">
      <label for="subject">Subject *</label>
      <select id="subject" name="subject" required>
        <option value="" disabled selected>Select a subject</option>
        <option value="Research Collaboration">Research Collaboration</option>
        <option value="Speaking Engagement">Speaking Engagement</option>
        <option value="Consulting Request">Consulting Request</option>
        <option value="Other">Other</option>
      </select>
    </div>
    
    <div class="form-group">
      <label for="message">Message *</label>
      <textarea id="message" name="message" rows="6" required
                minlength="20" maxlength="2000"
                placeholder="Please provide details about your inquiry (20-2000 characters)"></textarea>
      <div class="char-count">
        <span id="char-count">0</span> / 2000 characters
      </div>
    </div>
    

    
    <div class="form-submit">
      <button type="submit" id="submit-btn" class="btn btn--primary" disabled>
        <span class="btn-text">Send Message</span>
        <span class="btn-loading" style="display: none;">
          <span class="spinner"></span> Sending...
        </span>
      </button>
      <div class="form-status" id="form-status"></div>
    </div>
  </form>
</div>

<style>
.contact-form-wrapper {
  max-width: 600px;
  margin: 2rem auto;
  padding: 2rem;
  background: #f8f9fa;
  border-radius: 8px;
  border: 1px solid #e9ecef;
}

.contact-form-description {
  color: #666;
  margin-bottom: 1.5rem;
  font-size: 0.95rem;
}

.form-group {
  margin-bottom: 1.5rem;
}

.form-group label {
  display: block;
  margin-bottom: 0.5rem;
  font-weight: 600;
  color: #333;
}

.form-group input[type="text"],
.form-group input[type="email"],
.form-group select,
.form-group textarea {
  width: 100%;
  padding: 0.75rem;
  border: 1px solid #ddd;
  border-radius: 4px;
  font-size: 1rem;
  transition: border-color 0.3s;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
  outline: none;
  border-color: #3498db;
  box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
}

.form-group textarea {
  resize: vertical;
  min-height: 120px;
}

.char-count {
  text-align: right;
  font-size: 0.85rem;
  color: #666;
  margin-top: 0.25rem;
}



.form-submit {
  margin-top: 2rem;
}

#submit-btn {
  padding: 0.75rem 2rem;
  font-size: 1rem;
  cursor: pointer;
  transition: all 0.3s;
}

#submit-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.btn-loading .spinner {
  display: inline-block;
  width: 1rem;
  height: 1rem;
  border: 2px solid rgba(255,255,255,0.3);
  border-radius: 50%;
  border-top-color: white;
  animation: spin 1s linear infinite;
  margin-right: 0.5rem;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.form-status {
  margin-top: 1rem;
  padding: 0.75rem;
  border-radius: 4px;
  display: none;
}

.form-status.success {
  background: #d4edda;
  color: #155724;
  border: 1px solid #c3e6cb;
  display: block;
}

.form-status.error {
  background: #f8d7da;
  color: #721c24;
  border: 1px solid #f5c6cb;
  display: block;
}



/* Responsive design */
  @media (max-width: 768px) {
    .contact-form-wrapper {
      padding: 1.5rem;
      margin: 1rem;
    }
  }
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const form = document.getElementById('secure-contact-form');
  const messageField = document.getElementById('message');
  const charCount = document.getElementById('char-count');
  const submitBtn = document.getElementById('submit-btn');
  const formStatus = document.getElementById('form-status');

  const emailField = document.getElementById('email');
  const replyToField = document.getElementById('_replyto');
  
  // Character counter for message
  messageField.addEventListener('input', function() {
    const length = this.value.length;
    charCount.textContent = length;
    
    if (length > 2000) {
      this.value = this.value.substring(0, 2000);
      charCount.textContent = 2000;
    }
  });
  
  // Enable submit button (no privacy consent required)
  submitBtn.disabled = false;
  
  // Copy email to hidden replyto field (for Formspree)
  emailField.addEventListener('blur', function() {
    if (this.value && this.checkValidity()) {
      replyToField.value = this.value;
    }
  });
  
  // Form submission handler
  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    
    // Check honeypot field
    const honeypot = document.getElementById('website');
    if (honeypot.value) {
      // Bot detected - silently fail
      console.log('Bot detected via honeypot');
      showFormStatus('Thank you for your message. We will get back to you soon.', 'success');
      form.reset();
      return;
    }
    
    // Check rate limiting (simple client-side check)
    const lastSubmit = localStorage.getItem('lastFormSubmit');
    const now = Date.now();
    if (lastSubmit && (now - parseInt(lastSubmit)) < 30000) { // 30 seconds
      showFormStatus('Please wait 30 seconds before submitting another message.', 'error');
      return;
    }
    
    // Show loading state
    const btnText = submitBtn.querySelector('.btn-text');
    const btnLoading = submitBtn.querySelector('.btn-loading');
    btnText.style.display = 'none';
    btnLoading.style.display = 'inline-block';
    submitBtn.disabled = true;
    
    try {
      // Prepare form data
      const formData = new FormData(form);
      
      // Add additional security headers
      const headers = {
        'Accept': 'application/json',
        'X-Requested-With': 'XMLHttpRequest'
      };
      
      // Submit to Formspree
      const response = await fetch(form.action, {
        method: 'POST',
        body: formData,
        headers: headers,
        mode: 'cors'
      });
      
      if (response.ok) {
        // Success
        showFormStatus('Thank you! Your message has been sent successfully.', 'success');
        form.reset();
        localStorage.setItem('lastFormSubmit', now.toString());
        
        // Reset character count
        charCount.textContent = '0';
        
        // Reset submit button
        submitBtn.disabled = false;
      } else {
        // Error
        const error = await response.json();
        showFormStatus('Sorry, there was an error sending your message. Please try again later.', 'error');
        console.error('Form submission error:', error);
      }
    } catch (error) {
      // Network error
      showFormStatus('Network error. Please check your connection and try again.', 'error');
      console.error('Form submission network error:', error);
    } finally {
      // Reset button state
      btnText.style.display = 'inline-block';
      btnLoading.style.display = 'none';
      submitBtn.disabled = false;
    }
  });
  
  function showFormStatus(message, type) {
    formStatus.textContent = message;
    formStatus.className = 'form-status ' + type;
    
    // Auto-hide success messages after 5 seconds
    if (type === 'success') {
      setTimeout(() => {
        formStatus.style.display = 'none';
      }, 5000);
    }
  }
  
  // Initialize form state
  submitBtn.disabled = false;
});
</script>
