<div class="secure-contact-options">
    <link rel="stylesheet" href="{{ '/_includes/assets/css/ui-e8091b.css' | relative_url }}">
    <script src="{{ '/_includes/assets/js/asset-f1f732ed.js' | relative_url }}" defer></script>
    
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        var contactBtn = document.getElementById('contactActionBtnAbout');
        if (contactBtn) {
            contactBtn.addEventListener('click', function() {
                if (typeof processContactInfo === 'function') {
                    var contactInfo = processContactInfo('reveal');
                    if (contactInfo) {
                        var display = document.getElementById('contactInfoDisplayAbout');
                        var link = document.getElementById('contactInfoLinkAbout');
                        
                        if (display && link) {
                            link.href = 'mailto:' + contactInfo;
                            link.textContent = contactInfo;
                            display.style.display = 'block';
                            
                            this.innerHTML = '<i class="fa fa-check"></i> Email Revealed';
                            this.style.backgroundColor = '#2ecc71';
                            this.disabled = true;
                        }
                    }
                }
            });
        }
    });
    </script>
    
    <div class="analytics-panel">
        <button id="contactActionBtnAbout" class="ui-enhance">
            <i class="fa fa-envelope" aria-hidden="true"></i> Reveal Email Address
        </button>
        
        <div class="contact-reveal-panel" id="contactInfoDisplayAbout">
            <div class="contact-info">
                <span class="info-label">Email:</span>
                <a id="contactInfoLinkAbout" href="#"></a>
            </div>
        </div>
    </div>
</div>
